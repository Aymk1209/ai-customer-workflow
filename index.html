<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project 2: Dynamic AI Customer Lead Routing Engine</title>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.344.0/dist/umd/lucide.min.js"></script>
    <style>
        :root { --bg-primary: #090d16; --bg-secondary: #111827; --text-main: #f9fafb; --text-muted: #9ca3af; --accent-green: #34d399; --border-color: #374151; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); padding: 40px 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        header { margin-bottom: 40px; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; }
        .badge { background: rgba(52, 211, 153, 0.1); color: var(--accent-green); padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; display: inline-block; margin-bottom: 12px; }
        h1 { font-size: 2.2rem; margin-bottom: 8px; background: linear-gradient(to right, #f9fafb, #9ca3af); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .panel { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 12px; padding: 24px; margin-bottom: 30px; }
        .panel-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        textarea { width: 100%; height: 120px; background: #020617; border: 1px solid var(--border-color); padding: 14px; border-radius: 8px; color: #fff; font-size: 0.95rem; margin-bottom: 16px; resize: none; }
        .config-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 20px; }
        select { background: #020617; border: 1px solid var(--border-color); padding: 10px; border-radius: 6px; color: #fff; }
        .action-btn { background: #059669; color: #fff; border: none; padding: 12px 24px; border-radius: 6px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .output-box { background: #020617; border-left: 4px solid var(--accent-green); padding: 20px; border-radius: 0 8px 8px 0; font-family: monospace; font-size: 0.85rem; white-space: pre-wrap; color: #cbd5e1; display: none; margin-top: 20px; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <span class="badge">Project 2: Live Inbound Routing Simulator</span>
        <h1>Dynamic AI Customer Intake Router</h1>
        <p style="color: var(--text-muted);">Paste or write any inbound client inquiry description below to test dynamic qualification routing thresholds live.</p>
    </header>

    <div class="panel">
        <div class="panel-title"><i data-lucide="mail"></i> Paste Incoming Lead Inquiry Context</div>
        <textarea id="p2-email">We are an enterprise infrastructure firm with 650 employees. We are running into severe manual accounting backlogs that exhaust 30 team hours every single week. We have budget signed off and need to implement an automated software workflow wrapper within the next 30 days.</textarea>
        
        <div class="config-grid">
            <div style="display:flex; flex-direction:column; gap:6px;">
                <label style="font-size:0.85rem; color:var(--text-muted);">Inbound Executive Seniority Tier</label>
                <select id="p2-role">
                    <option value="high">Decision Maker (VP, Director, CXO)</option>
                    <option value="low">End User / Associate / Coordinator</option>
                </select>
            </div>
        </div>

        <button class="action-btn" onclick="runDynamicProject2()"><i data-lucide="cpu"></i> Evaluate Lead & Sync CRM Record</button>
        <div id="p2-output" class="output-box"></div>
    </div>
</div>
<script>
    lucide.createIcons();
    function runDynamicProject2() {
        const emailContent = document.getElementById('p2-email').value;
        const tier = document.getElementById('p2-role').value;
        
        // Dynamic scoring algorithm logic based on real input analysis
        let fitScore = 40; 
        if(emailContent.toLowerCase().includes('enterprise') || emailContent.toLowerCase().includes('650') || emailContent.toLowerCase().includes('500')) fitScore += 25;
        if(emailContent.toLowerCase().includes('hours') || emailContent.toLowerCase().includes('backlog')) fitScore += 20;
        if(tier === 'high') fitScore += 15;

        const routeNode = fitScore >= 75 ? "HOT ENTERPRISE PIPELINE NODE" : "WARM MARKETING NURTURE NODE";
        const actionTaken = fitScore >= 75 ? "Created Active Opportunity Ticket & Assigned High Priority SLA Warning Rule to Account Executive." : "Synced Basic Prospect Record into Long-Term Email Campaign Tracker.";

        const logOutput = 
`[MAKE ROUTER INGESTION TRIGGERED] -> Parsing raw character matrices...
[QUALIFICATION SCORE LOGIC CALCULATED]:
  - Baseline Signal Reading: Multi-factor verification active.
  - Calculated Fit Probability Metrics: Approved.
  => AGGREGATE EVALUATION SCORE: ${fitScore}/100 -> MAPPED ROUTE: [${routeNode}]

[CRM SYNCHRONIZATION STEP]: Successfully updated HubSpot database arrays.
[AUTOMATED PROTOCOL ACTION]: ${actionTaken}

[CONTEXTUAL AI EMAIL DRAFT GENERATED FOR AGENT MANUAL APPROVAL]:
"Subject: Addressing operational backlogs across your workflows

Hi Team,

I carefully reviewed your structural overview regarding the operational challenges currently creating administrative backlogs within your organization. 

Our integration engine is designed specifically to resolve this type of friction by establishing programmatic data linkages, freeing up valuable staff hours without forcing a complete software replacement.

Are you open for a brief, 10-minute technical sync this week to cross-examine our baseline solution blueprints?

Best regards,
Automated Systems Support Group"`;

        const out = document.getElementById('p2-output');
        out.style.display = 'block';
        out.innerText = logOutput;
    }
</script>
</body>
</html>
