<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project 2: Truly Dynamic AI Customer Lead Engine</title>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.344.0/dist/umd/lucide.min.js"></script>
    <style>
        :root { --bg-primary: #090d16; --bg-secondary: #111827; --text-main: #f9fafb; --text-muted: #9ca3af; --accent-green: #34d399; --border-color: #374151; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); padding: 40px 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        header { margin-bottom: 40px; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; }
        .badge { background: rgba(52, 211, 153, 0.1); color: var(--accent-green); padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; display: inline-block; margin-bottom: 12px; }
        h1 { font-size: 2.2rem; margin-bottom: 8px; background: linear-gradient(to right, #f9fafb, #9ca3af); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .panel { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 12px; padding: 24px; margin-bottom: 30px; }
        .panel-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        textarea { width: 100%; height: 180px; background: #020617; border: 1px solid var(--border-color); padding: 14px; border-radius: 8px; color: #fff; font-size: 0.95rem; margin-bottom: 16px; line-height: 1.5; resize: none; }
        .config-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 20px; }
        select { background: #020617; border: 1px solid var(--border-color); padding: 10px; border-radius: 6px; color: #fff; font-size: 0.9rem; }
        .action-btn { background: #059669; color: #fff; border: none; padding: 12px 24px; border-radius: 6px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 0.95rem; }
        .output-box { background: #020617; border-left: 4px solid var(--accent-green); padding: 20px; border-radius: 0 8px 8px 0; font-family: monospace; font-size: 0.85rem; white-space: pre-wrap; color: #cbd5e1; display: none; margin-top: 20px; line-height: 1.6; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <span class="badge">Project 2: Live Inbound Routing Simulator</span>
        <h1>Dynamic AI Customer Intake Router</h1>
        <p style="color: var(--text-muted);">Paste ANY unorganized inbound business profile or customer email below to compute automated scoring matrix allocations live.</p>
    </header>

    <div class="panel">
        <div class="panel-title"><i data-lucide="mail"></i> Input Inbound Lead Profile Card Context</div>
        <textarea id="p2-email" placeholder="Paste incoming company profile context here..."></textarea>
        
        <div class="config-grid">
            <div style="display:flex; flex-direction:column; gap:6px;">
                <label style="font-size:0.85rem; color:var(--text-muted); font-weight:600;">Inbound Prospect Seniority Tier</label>
                <select id="p2-role">
                    <option value="high">Decision Maker (VP, Director, Owner, CXO)</option>
                    <option value="low">End User / Coordinator / Operational Associate</option>
                </select>
            </div>
        </div>

        <button class="action-btn" onclick="runTrulyDynamicProject2()"><i data-lucide="cpu"></i> Evaluate Lead & Sync CRM Record</button>
        <div id="p2-output" class="output-box"></div>
    </div>
</div>

<script>
    lucide.createIcons();

    // Default template on window load
    document.getElementById('p2-email').value = "INBOUND METRIC SHEET:\nCompany Name: TechCorp Solutions\nScale parameters: Operating with a staff of 450 employees.\nStated Friction: We are losing roughly 30 hours per week due to severe manual data entry latency across our administrative databases.";

    function runTrulyDynamicProject2() {
        const inputText = document.getElementById('p2-email').value.trim();
        const tier = document.getElementById('p2-role').value;
        const out = document.getElementById('p2-output');

        if (!inputText) {
            out.style.display = 'block';
            out.innerText = "[ERROR: No character context found. Please paste lead profile metadata.]";
            return;
        }

        // 1. Dynamic Extraction Rules
        // Try to capture a company name or use a default fallback placeholder
        const companyMatch = inputText.match(/(?:Company Name:\s*|Firm:\s*|from\s+)([A-Za-z0-9_ ]+)/i);
        const derivedCompany = companyMatch ? companyMatch[1].trim() : "Your Organization";

        // Try to isolate the friction point line dynamically
        const lines = inputText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
        let derivedFriction = "manual operational pipeline bottlenecks";
        for (let line of lines) {
            if (line.toLowerCase().includes('friction') || line.toLowerCase().includes('losing') || line.toLowerCase().includes('bottleneck') || line.toLowerCase().includes('leakage')) {
                derivedFriction = line;
                break;
            }
        }

        // 2. Compute Firmographic Scoring Algorithm Rules
        let matrixScore = 35; // Baseline tracking score
        let corporateScaleFit = 10;
        let painSignalFit = 15;
        let authorityFit = tier === 'high' ? 25 : 10;

        // Dynamic checking for volume and headcount indicators
        const numbers = inputText.match(/\d+/g) || [];
        const largeNumbersExist = numbers.some(num => parseInt(num) >= 100);
        
        if (largeNumbersExist || inputText.toLowerCase().includes('enterprise') || inputText.toLowerCase().includes('global')) {
            corporateScaleFit = 25;
            matrixScore += 20;
        }
        if (inputText.toLowerCase().includes('hours') || inputText.toLowerCase().includes('backlog') || inputText.toLowerCase().includes('latency')) {
            painSignalFit = 25;
            matrixScore += 20;
        }
        if (tier === 'high') {
            matrixScore += 15;
        }

        // Bound final score mathematically between 0 and 100
        const finalScore = Math.min(matrixScore + corporateScaleFit + painSignalFit, 100);

        // 3. Conditional Node Branching Logic
        const routeNode = finalScore >= 75 ? "HOT ENTERPRISE PIPELINE NODE" : "WARM MARKETING NURTURE NODE";
        const crmAction = finalScore >= 75 
            ? `[WEBHOOK TRIGGERED] -> Opened High-Priority Deal Record for '${derivedCompany}'. Generated immediate follow-up Task assigned directly to regional Account Executive.`
            : `[ROUTER LINKED] -> Synced basic contact parameters for '${derivedCompany}' into Secondary Long-Term Campaign Sequence Database.`;

        // 4. Output Render Layout Matrix
        const logLayout = 
`[MAKE ROUTER INGESTION TRIGGERED] -> Ingesting raw profile strings...
[AI CORE MATRIX ENGINE] -> Cross-examining inbound parameters against scoring rubrics:
  - Target Industry/Pain Alignment Index: ${painSignalFit}/25
  - Firmographic Corporate Scale Index: ${corporateScaleFit}/25
  - Prospect Lead Authority Index: ${authorityFit}/25
  => AGGREGATE CALCULATED FIT SCORE: ${finalScore}/100 -> MAPPED ROUTE: [${routeNode}]

================================================================================
HUBSPOT CRM REAL-TIME DATABASE SYNCHRONIZATION
================================================================================
* Target Entity Isolated: ${derivedCompany}
* Automation Step Executed: ${crmAction}

================================================================================
AI-GENERATED OUTBOUND DRAFT (SAVED TO DRAFTS FOR AGENT AUDIT)
================================================================================
Subject: Addressing core operational friction at ${derivedCompany}

Hi Team,

I carefully evaluated your structural briefing regarding the current operational bottlenecks impacting your team, specifically noting that: "${derivedFriction.substring(0, 110)}".

Our integration frameworks are engineered precisely to bridge these exact cross-application silos, automating data validation parameters and reclaiming lost staff hours without requiring expensive alterations to your baseline legacy infrastructure.

Are you available for a brief, 10-minute technical sync this coming Thursday to run through our baseline optimization blueprints?

Best regards,
Business Operations Optimization Group
[Responsible AI Guardrail: Sent to Pending Approval Draft Queue]`;

        out.style.display = 'block';
        out.innerText = logLayout;
    }
</script>
</body>
</html>
